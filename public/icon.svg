<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#011A48"/>
      <stop offset="100%" stop-color="#013B85"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#000a23" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Center Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glowGrad)"/>

  <!-- Flight Arc -->
  <path d="M 65 240 A 190 190 0 0 1 445 240" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" opacity="0.85"/>

  <!-- Airplane on Arc -->
  <g transform="translate(260, 56) rotate(-15)">
    <polygon points="35,10 12,18 5,12 7,21 0,24 7,26 15,27 25,34 28,33 24,28" fill="#ffffff"/>
  </g>

  <!-- Main Logo Mark: U2 + Palm Tree -->
  <g filter="url(#shadow)">
    <!-- U2 Text Path / Text rendering -->
    <text x="75" y="325" font-family="'Caveat', 'Comic Sans MS', cursive, sans-serif" font-size="250" font-weight="900" fill="#84cc16" letter-spacing="-5">U2</text>
    
    <!-- Palm Tree Silhouette -->
    <g transform="translate(340, 160) scale(1.1)" fill="#84cc16">
      <path d="M45,120 Q55,70 65,10 Q68,60 55,120 Z"/>
      <path d="M60,20 Q20,-10 0,15 Q30,10 55,25 Z"/>
      <path d="M62,18 Q90,-20 120,5 Q85,15 58,25 Z"/>
      <path d="M55,25 Q15,40 -20,70 Q20,55 52,32 Z"/>
      <path d="M65,25 Q100,50 135,80 Q90,65 60,35 Z"/>
      <path d="M58,15 Q60,-40 55,-60 Q50,-30 55,10 Z"/>
    </g>
  </g>
</svg>
